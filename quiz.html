<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真题题库 — 执业药师考试</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#FFFFFF;--paper-dark:#F7F8FA;--ink:#1A1A2E;--ink-secondary:#3D4F6F;--ink-tertiary:#6B7B96;--ink-quaternary:#9EAFC0;--border:#E0E4EA;--border-light:#EEF0F4;--accent:#1B365D;--accent-light:#F0F3F8;--green:#1B5E20;--green-light:#E8F5E9;--red:#C62828;--red-light:#FFEBEE;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-hover:0 4px 12px rgba(27,54,93,.1)}
body{font-family:'Noto Sans SC','Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}

/* Header */
.header{background:var(--accent);color:#fff;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #0D1B33}
.header h1{font-family:'Noto Serif SC',SimSun,serif;font-size:1.2rem;font-weight:700;letter-spacing:.03em}
.header-right{display:flex;align-items:center;gap:1.5rem}
.header a{color:#fff;text-decoration:none;font-size:.8rem;font-weight:500;opacity:.85;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:1px;transition:opacity .2s}
.header a:hover{opacity:1;border-bottom-color:#fff}
.header .masthead{font-family:Inter,system-ui,sans-serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;opacity:.6}

/* Container */
.container{max-width:880px;margin:0 auto;padding:2rem 1.5rem}

/* Mode bar */
.mode-bar{display:flex;gap:.5rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border-light)}
.mode-bar button{padding:.45rem 1.1rem;border:1px solid var(--border);border-radius:4px;background:var(--paper);cursor:pointer;font-size:.8rem;font-weight:500;color:var(--ink-secondary);font-family:Inter,system-ui,sans-serif;letter-spacing:.02em;transition:all .15s}
.mode-bar button:hover{border-color:var(--accent);color:var(--accent)}
.mode-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-bar .random-btn{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.mode-bar .random-btn:hover{opacity:.9}

/* Filters */
.filters{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filters select{padding:.5rem .75rem;border:1px solid var(--border);border-radius:4px;font-size:.8rem;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;cursor:pointer;min-width:160px}
.filters button{padding:.5rem 1.25rem;border:none;border-radius:4px;font-size:.8rem;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;font-family:Inter,system-ui,sans-serif;letter-spacing:.03em;transition:background .15s}
.filters button:hover{background:#0D1B33}

/* Stats */
.stats{color:var(--ink-tertiary);font-size:.8rem;margin-bottom:1.25rem;font-family:Inter,system-ui,sans-serif;letter-spacing:.01em;padding-bottom:.75rem;border-bottom:1px solid var(--border-light)}

/* Question cards */
.q-card{border:1px solid var(--border);border-radius:6px;padding:1.5rem;margin-bottom:1.25rem;background:var(--paper);box-shadow:var(--shadow);transition:box-shadow .2s}
.q-card:hover{box-shadow:var(--shadow-hover)}
.q-title{font-weight:600;margin-bottom:1rem;font-size:.95rem;line-height:1.75;color:var(--ink)}
.q-title .q-idx{color:var(--accent);margin-right:.4rem;font-family:Inter,system-ui,sans-serif;font-weight:700}
.q-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.q-meta span{font-size:.7rem;padding:.2rem .6rem;border-radius:3px;background:var(--accent-light);color:var(--accent);font-family:Inter,system-ui,sans-serif;font-weight:500;letter-spacing:.02em}

/* Options */
.options{list-style:none;margin-bottom:1rem}
.options li{padding:.65rem .85rem;margin-bottom:.35rem;border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .12s;font-size:.875rem;line-height:1.6}
.options li:hover{border-color:var(--accent);background:var(--accent-light)}
.options li.correct{border-color:var(--green);background:var(--green-light);color:var(--green);font-weight:600}
.options li.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}
.options li strong{color:var(--accent);margin-right:.35rem;font-family:Inter,system-ui,sans-serif}

/* Answer box */
.answer-box{display:none;margin-top:1rem;padding:1rem 1.25rem;border-radius:4px;background:var(--paper-dark);border-left:3px solid var(--accent)}
.answer-box.show{display:block}
.answer-box .label{font-weight:700;color:var(--accent);margin-bottom:.35rem;font-size:.85rem;font-family:Inter,system-ui,sans-serif}
.answer-box .analysis{color:var(--ink-secondary);font-size:.85rem;line-height:1.75}
.show-answer-btn{background:none;border:1px solid var(--border);color:var(--ink-tertiary);padding:.4rem 1rem;border-radius:4px;cursor:pointer;font-size:.8rem;font-family:Inter,system-ui,sans-serif;font-weight:500;transition:all .15s}
.show-answer-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:.3rem;margin-top:1.5rem;flex-wrap:wrap}
.pagination button{padding:.35rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--paper);cursor:pointer;font-size:.75rem;min-width:1.8rem;font-family:Inter,system-ui,sans-serif;color:var(--ink-secondary);transition:all .12s}
.pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pagination button:hover:not(.active){background:var(--accent-light);border-color:var(--accent)}
.pagination .ellipsis{padding:0 .2rem;color:var(--ink-quaternary);font-size:.75rem}

/* Responsive */
@media(max-width:640px){
  .container{padding:1rem}
  .q-card{padding:1rem}
  .filters{flex-direction:column}
  .filters select{min-width:100%}
  .header{padding:1rem 1.25rem}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="masthead">Licensed Pharmacist Exam</div>
    <h1>真题题库</h1>
  </div>
  <div class="header-right">
    <a href="/">← 返回首页</a>
  </div>
</div>

<div class="container">
  <div class="mode-bar">
    <button class="active" onclick="setMode('browse')">浏览模式</button>
    <button onclick="setMode('practice')">刷题模式</button>
    <button class="random-btn" onclick="loadRandom()">随机10题</button>
  </div>

  <div class="filters" id="filters">
    <select id="subjectSelect" onchange="onSubjectChange()">
      <option value="">选择科目</option>
    </select>
    <select id="chapterSelect" onchange="onChapterChange()">
      <option value="">全部章节</option>
    </select>
    <button onclick="loadQuestions()">查询</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="questions"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
var currentMode = 'browse';
var currentSubject = '';
var currentChapter = '';
var currentPage = 1;
var practiceState = {answered: 0, correct: 0};

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-bar button').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  document.getElementById('filters').style.display = m === 'practice' ? 'none' : 'flex';
  if (m === 'practice') loadRandom();
}

function loadSubjects() {
  fetch('/api/questions/subjects').then(function(r) { return r.json(); }).then(function(data) {
    var sel = document.getElementById('subjectSelect');
    sel.innerHTML = '<option value="">选择科目</option>';
    data.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.subject;
      opt.textContent = s.subject + ' (' + s.count + '题)';
      sel.appendChild(opt);
    });
  });
}

function onSubjectChange() {
  currentSubject = document.getElementById('subjectSelect').value;
  currentChapter = '';
  if (currentSubject) {
    fetch('/api/questions/chapters?subject=' + encodeURIComponent(currentSubject))
      .then(function(r) { return r.json(); }).then(function(data) {
        var sel = document.getElementById('chapterSelect');
        sel.innerHTML = '<option value="">全部章节</option>';
        data.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c.chapter;
          opt.textContent = c.chapter + ' (' + c.count + '题)';
          sel.appendChild(opt);
        });
      });
  } else {
    document.getElementById('chapterSelect').innerHTML = '<option value="">全部章节</option>';
  }
  loadQuestions();
}

function onChapterChange() {
  currentChapter = document.getElementById('chapterSelect').value;
  currentPage = 1;
  loadQuestions();
}

function loadQuestions() {
  var url = '/api/questions?page=' + currentPage + '&size=20';
  if (currentSubject) url += '&subject=' + encodeURIComponent(currentSubject);
  if (currentChapter) url += '&chapter=' + encodeURIComponent(currentChapter);
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    document.getElementById('stats').textContent = '共 ' + data.total + ' 题，第 ' + data.page + '/' + Math.ceil(data.total / data.size) + ' 页';
    renderQuestions(data.items, false);
    renderPagination(data.total, data.size, data.page);
  });
}

function loadRandom() {
  var url = '/api/questions/random?count=10';
  if (currentSubject) url += '&subject=' + encodeURIComponent(currentSubject);
  practiceState = {answered: 0, correct: 0};
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    document.getElementById('stats').textContent = '随机刷题模式';
    document.getElementById('pagination').innerHTML = '';
    renderQuestions(data, true);
  });
}

function renderQuestions(items, isPractice) {
  var html = '';
  items.forEach(function(q, i) {
    var opts = q.options.map(function(o, j) {
      var letter = String.fromCharCode(65 + j);
      var clean = o.replace(/^[A-E]\.\s*/, '').replace(/<[^>]+>/g, '');
      return '<li data-idx="' + i + '" data-letter="' + letter + '" onclick="selectOption(this,' + i + ',\'' + q.answer + '\',' + isPractice + ')">' +
        '<strong>' + letter + '.</strong> ' + clean + '</li>';
    }).join('');

    html += '<div class="q-card" id="q-' + i + '">' +
      '<div class="q-meta"><span>' + q.subject + '</span><span>' + q.chapter + '</span></div>' +
      '<div class="q-title"><span class="q-idx">' + q.index + '.</span>' + q.title.replace(/<[^>]+>/g, '') + '</div>' +
      '<ul class="options" id="opts-' + i + '">' + opts + '</ul>' +
      '<button class="show-answer-btn" onclick="toggleAnswer(' + i + ')">查看答案</button>' +
      '<div class="answer-box" id="ans-' + i + '">' +
        '<div class="label">答案：' + q.answer + '</div>' +
        '<div class="analysis">' + (q.analysis || '暂无解析').replace(/<[^>]+>/g, '') + '</div>' +
      '</div></div>';
  });
  document.getElementById('questions').innerHTML = html;
}

function selectOption(el, qi, answer, isPractice) {
  var opts = document.getElementById('opts-' + qi);
  if (opts.classList.contains('answered')) return;
  opts.classList.add('answered');
  var selected = el.getAttribute('data-letter');
  var lis = opts.querySelectorAll('li');
  lis.forEach(function(li) {
    var letter = li.getAttribute('data-letter');
    if (letter === answer) li.classList.add('correct');
    else if (letter === selected && selected !== answer) li.classList.add('wrong');
  });
  if (isPractice) {
    practiceState.answered++;
    if (selected === answer) practiceState.correct++;
    document.getElementById('stats').textContent = '刷题进度：' + practiceState.answered + ' 题，正确 ' + practiceState.correct + ' 题，正确率 ' + Math.round(practiceState.correct / practiceState.answered * 100) + '%';
  }
  document.getElementById('ans-' + qi).classList.add('show');
}

function toggleAnswer(i) {
  document.getElementById('ans-' + i).classList.toggle('show');
}

function renderPagination(total, size, page) {
  var pages = Math.ceil(total / size);
  if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  var html = '';
  function btn(p) {
    html += '<button class="' + (p === page ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  function ellipsis() { html += '<span class="ellipsis">…</span>'; }
  if (page > 1) html += '<button onclick="goPage(' + (page-1) + ')">‹</button>';
  if (pages <= 7) {
    for (var p = 1; p <= pages; p++) btn(p);
  } else {
    btn(1);
    if (page > 3) ellipsis();
    for (var p = Math.max(2, page-1); p <= Math.min(pages-1, page+1); p++) btn(p);
    if (page < pages-2) ellipsis();
    btn(pages);
  }
  if (page < pages) html += '<button onclick="goPage(' + (page+1) + ')">›</button>';
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  loadQuestions();
  window.scrollTo(0, 0);
}

loadSubjects();
loadQuestions();
</script>
</body>
</html>
